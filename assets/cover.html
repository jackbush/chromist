<!doctype html>
<!--
  Source for public/cover.png, the link preview image named by site.config.ts.
  Regenerate after editing:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars \
      --force-device-scale-factor=2 --window-size=1200,630 \
      --screenshot=/tmp/cover@2x.png assets/cover.html
    sips --resampleHeightWidth 630 1200 /tmp/cover@2x.png --out public/cover.png

  Rendered at 2× and resampled down so the type stays crisp at 1200×630.
-->
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
        padding: 0;
      }

      body {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background: #000;
        color: #fff;
        font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
        -webkit-font-smoothing: antialiased;
      }

      h1 {
        font-size: 92px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      p {
        margin-top: 20px;
        max-width: 34ch;
        font-size: 30px;
        line-height: 1.35;
        color: rgb(255 255 255 / 0.7);
      }

      /* Swatches read the way the audit does: colour, then its score on black. */
      .swatches {
        display: flex;
        gap: 20px;
      }

      .swatch {
        flex: 1;
        height: 190px;
        display: flex;
        align-items: flex-end;
        padding: 16px;
        border-radius: 4px;
        background: var(--c);
        color: var(--on);
        font-size: 22px;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Chromist</h1>
      <p>Get your colours right.</p>
    </header>
    <div class="swatches">
      <div class="swatch" style="--c: oklch(0.72 0.19 24); --on: #000">92</div>
      <div class="swatch" style="--c: oklch(0.83 0.17 85); --on: #000">Lc 98</div>
      <div class="swatch" style="--c: oklch(0.88 0.24 140); --on: #000">104</div>
      <div class="swatch" style="--c: oklch(0.68 0.17 235); --on: #000">85</div>
      <div class="swatch" style="--c: oklch(0.52 0.24 300); --on: #fff">62</div>
    </div>
  </body>
</html>
